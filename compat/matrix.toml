# Compatibility matrix template (phase-0 gate). Fill in verdicts from real device runs.
# Verdicts: unverified | pass | fail | unsupported.  See docs/superpowers/specs (section 6).
# [[operation]] iphone_baseline: the iPhone's own resource changes for this case/op are captured and understood, so Twydo knows what to write.
# mod:* rows verify repeat modifiers; a class with a modifier passes only if its base row and every modifier row pass.
matrix_version = 1

[environment]
mac_2do = "unavailable (subscription required)"
iphone_2do = "3.91 build 38246"
ios = "27.0.1"
macos = "27.0.1"
server = "Synology Calendar (DSM 7.1.1-42962 Update 9)"
server_version = "2.4.8-10948"
vdirsyncer = "0.21.0"

[[rule]]
class = "days"
preserve = "unverified"
execute = "unverified"
edit = "unverified"
evidence = []
notes = "Not tested in phase 0: class not used by the current data, and only one 2Do device (iPhone) was available. Verify when a task needs it."

