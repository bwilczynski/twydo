preserve = "pass"
execute = "pass"
edit = "pass"
evidence = ["fixtures/complete/monthly-calendar", "fixtures/complete/monthly-calendar", "fixtures/complete/monthly-calendar"]
notes = "RRULE:FREQ=MONTHLY with no BYMONTHDAY (day from DUE); edit to every 2 months gives INTERVAL=2 and RecurrenceValue 2. Verified on iPhone 2Do only (no second 2Do device). 2Do writes DTSTART as a copy of DUE on recurring tasks too; Twydo reads the start from <2Do Meta> StartDate, so DTSTART is not treated as a start date. Completing advances the same UID by one interval and adds a new completed copy (new UID, no RRULE, RUID = original)."

