# Compatibility matrix template (phase-0 gate). Fill in verdicts from real device runs.
# Verdicts: unverified | pass | fail | unsupported.  See docs/superpowers/specs (section 6).
# [[operation]] iphone_baseline: the iPhone's own resource changes for this case/op are captured and understood, so Twydo knows what to write.
# mod:* rows verify repeat modifiers; a class with a modifier passes only if its base row and every modifier row pass.
matrix_version = 1

# Text-only writes reuse the captured field writer, preserving all scheduling,
# lifecycle, metadata and relationship bytes. See the text-edit capability audit.
[[operation]]
case = "resource-text"
op = "edit"
iphone_baseline = "pass"
mac_to_iphone = "unverified"
iphone_to_mac = "unverified"
twydo_to_iphone = "pass"
iphone_to_twydo = "pass"
evidence = ["fixtures/complete/standalone-lifecycle", "fixtures/complete/checklist-reset", "fixtures/complete/checklist-reset", "fixtures/complete/checklist-reset"]
notes = "Direct representative SUMMARY/DESCRIPTION edits on tasks and recurring checklists/items, including phone return edits of Twydo output. Preservation generalization to recognized standalone resources and flat families across unchanged schedules and lifecycle states: only SUMMARY, DESCRIPTION, DTSTAMP and LAST-MODIFIED change. No recurrence execution/edit verdict is inferred. Readable metadata, unique identities and agreeing flat same-list links required; malformed/ambiguous fields, unknown types and nesting refuse. Mixed saves retain existing non-text contracts; missing capability rows retain legacy handling."

[environment]
mac_2do = "unavailable (subscription required)"
iphone_2do = "3.91 build 38246"
ios = "27.0.1"
macos = "27.0.1"
server = "Synology Calendar (DSM 7.1.1-42962 Update 9)"
server_version = "2.4.8-10948"
vdirsyncer = "0.21.0"

[[rule]]
class = "days"
preserve = "pass"
execute = "pass"
edit = "pass"
evidence = ["fixtures/set-repeat/phone-encodings", "fixtures/set-repeat/encoding-roundtrip", "fixtures/complete/recurrence-profiles", "fixtures/complete/recurrence-profiles", "fixtures/complete/recurrence-profiles"]
notes = "preserve: Plan 7 capture (iPhone 2Do, fixtures/set-repeat/phone-encodings; round-trip checked by crates/twydo-core/tests/ical_roundtrip.rs roundtrip_plan7_phone_captures, reading by crates/twydo-core/tests/repeat.rs plan7_captures_read_as_2do_shows_them). execute: Plan 7 session C (fixtures/complete/recurrence-profiles): the phone completed each `a` twin, Twydo completed its `b` twin, and Twydo's live task and history copy equal the phone's byte for byte, but for stamps and CREATED, the twins' UIDs and titles, the phone's layout lines and its JSON key order (crates/twydo-core/tests/edit_complete.rs twin_*): D1 (daily) and D3 (every 3 days). edit: Plan 7 session B, Twydo wrote the rule and the iPhone showed it right (a set/reshape, not an edit of an existing task of this class). Interval-only edits of this class are accepted as verified: the INTERVAL encoding is identical to monthly and yearly, whose interval edits the phone verified, and Twydo's gate lets only the interval change within a class. Editing existing daily and weekly tasks rests on their task-level edit rows (Plan 7 session C, fixtures/complete/recurrence-profiles)."

