notes = "Not tested in phase 0: class not used by the current data, and only one 2Do device (iPhone) was available. Verify when a task needs it. edit FAIL: Plan 7 session B, the iPhone (2Do 3.91, the last version available) misreads a Twydo-written rule of this class (last day: shown as plain monthly; last weekday: 'every workday'; 1st weekend day: 'every weekend day'), and its picker cannot create one. Twydo never writes it."

