preserve = "pass"
execute = "pass"
edit = "pass"
evidence = ["fixtures/phase0/v1/plan7-list1/01-phone-repeat", "fixtures/phase0/v1/plan7-twydo-list1/01-twydo-create", "fixtures/phase0/v1/plan7-twydo-list2/00-seed", "fixtures/phase0/v1/plan7-twydo-list2/01-phone-complete", "fixtures/phase0/v1/plan7-twydo-list2/02-twydo-complete"]
notes = "preserve: Plan 7 capture (iPhone 2Do, fixtures/phase0/v1/plan7-list1; round-trip checked by crates/twydo-core/tests/ical_roundtrip.rs roundtrip_plan7_phone_captures, reading by crates/twydo-core/tests/repeat.rs plan7_captures_read_as_2do_shows_them). execute: Plan 7 session C (fixtures/phase0/v1/plan7-twydo-list2): the phone completed each `a` twin, Twydo completed its `b` twin, and Twydo's live task and history copy equal the phone's byte for byte, but for stamps and CREATED, the twins' UIDs and titles, the phone's layout lines and its JSON key order (crates/twydo-core/tests/edit_complete.rs twin_*): D1 (daily) and D3 (every 3 days). edit: Plan 7 session B, Twydo wrote the rule and the iPhone showed it right (a set/reshape, not an edit of an existing task of this class). Interval-only edits of this class are accepted as verified: the INTERVAL encoding is identical to monthly and yearly, whose interval edits the phone verified, and Twydo's gate lets only the interval change within a class. Editing existing daily and weekly tasks rests on their task-level edit rows (Plan 7 session C, fixtures/phase0/v1/plan7-twydo-list2/03-twydo-edit)."

