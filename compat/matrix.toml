notes = "Plan 8 U1/U2 establish continuation/history end fields, inclusive boundary, final in-place completion and post-reopen execution in both directions. The execute pass is scoped by the compatibility gate to top-level plain interval-1 date-only daily or monthly day1-28, due anchored, no children/start/alerts/delay; the row verdict alone does not express this scope. Other UNTIL contexts stay refused even where offset/base-rule verdicts pass. Preserve/edit evidence from Plan 7 remains; this is not family/timed/from-completion UNTIL enablement."

