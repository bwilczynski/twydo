# release-plz keeps one release PR open with the next version (Cargo.toml bump +
# CHANGELOG.md) from conventional commits, and tags vX.Y.Z when it merges. The
# tag triggers dist (.github/workflows/release.yml), which builds and creates
# the GitHub release.
[workspace]
git_only = true
git_release_enable = false
semver_check = false
git_tag_name = "v{{ version }}"
# Tag only when a release PR merges, never on an untagged version in main.
release_always = false
# Only user-facing changes open a release PR.
release_commits = "^(feat|fix)"

# One version and one tag for the workspace. tdo carries the tag and the
# changelog (at the repository root). twydo-core is still released, untagged
# and without a changelog of its own, so that a change touching only the core
# bumps the version and lands in tdo's changelog (`changelog_include` skips
# packages with `release = false`).
[[package]]
name = "tdo"
changelog_path = "./CHANGELOG.md"
changelog_include = ["twydo-core", "twydo-daemon"]

[[package]]
name = "twydo-core"
git_tag_enable = false
changelog_update = false

# Released like twydo-core: untagged, in tdo's changelog. A new crate added to the workspace
# needs, until the first release tag that contains it, a `git_tag_name` of its own that is
# never created: with the shared `v{{ version }}`, release-plz looks for it in the tree of
# the previous tag and fails with "cannot find package". Remove that line once a release
# includes the crate (an untagged package stays an "initial release" and would open a
# release PR on every push). twydo-daemon needed it until v0.1.9.
[[package]]
name = "twydo-daemon"
git_tag_enable = false
changelog_update = false

[changelog]
commit_parsers = [
    { message = "^feat", group = "added" },
    { message = "^fix", group = "fixed" },
    { message = "^perf", group = "performance" },
    { message = "^(build|chore|ci|docs|refactor|style|test)", skip = true },
    { message = ".*", group = "other" },
]
