# release-plz keeps one release PR open with the next version (Cargo.toml bump +
# CHANGELOG.md) from conventional commits, and tags vX.Y.Z when it merges. The
# tag triggers dist (.github/workflows/release.yml), which builds and creates
# the GitHub release.
[workspace]
git_only = true
git_release_enable = false
semver_check = false
git_tag_name = "v{{ version }}"
# Tag only when a release PR merges, never on an untagged version in main.
release_always = false
# Only user-facing changes open a release PR.
release_commits = "^(feat|fix)"

# One version and one tag for the workspace. tdo carries the tag and the
# changelog (at the repository root). twydo-core is still released, untagged
# and without a changelog of its own, so that a change touching only the core
# bumps the version and lands in tdo's changelog (`changelog_include` skips
# packages with `release = false`).
[[package]]
name = "tdo"
changelog_path = "./CHANGELOG.md"
changelog_include = ["twydo-core", "twydo-daemon", "twydo-gateway", "twydo-web"]

[[package]]
name = "twydo-core"
git_tag_enable = false
changelog_update = false

# Released like twydo-core: untagged, in tdo's changelog. A new crate added to the workspace
# needs, until the first release tag that contains it, a `git_tag_name` of its own that is
# never created: with the shared `v{{ version }}`, release-plz looks for it in the tree of
# the previous tag and fails with "cannot find package". Remove that line once a release
# includes the crate (an untagged package stays an "initial release" and would open a
# release PR on every push). twydo-daemon needed it until v0.1.9.
[[package]]
name = "twydo-daemon"
git_tag_enable = false
changelog_update = false

# Released like twydo-daemon. It needed the never-created tag name until v0.6.0.
[[package]]
name = "twydo-gateway"
git_tag_enable = false
changelog_update = false

# The web app (web/): a package only so that web commits count as releasable changes and reach
# tdo's changelog; release-plz ignores paths outside every package. Released like
# twydo-gateway, and needs the never-created tag name (see twydo-daemon) until the first
# release tag that contains it.
[[package]]
name = "twydo-web"
git_tag_enable = false
changelog_update = false
git_tag_name = "twydo-web-v{{ version }}"

# Test support only: never released, tagged or put in a changelog.
[[package]]
name = "twydo-testdav"
release = false

[changelog]
# The web commits released before twydo-web existed (in v0.6.0 to v0.6.3, but never in the
# changelog). As a new package, twydo-web would list them all in its first release. Remove
# these once a release includes twydo-web, with its `git_tag_name` above.
commit_parsers = [
    { sha = "9ad8837c9568959c38c1cd914eda679150451f89", skip = true }, # edit, add items to and del…
    { sha = "1153182617a5aa8bc8dec7bd7c63e708d9b3408b", skip = true }, # add the task form sheet
    { sha = "fffd734c6da88ed82b27d88a829288f5faf9ccbf", skip = true }, # check, save and delete tas…
    { sha = "bd6da5badf593b8f84ddf7e6e21a973534d95d33", skip = true }, # lock a ticked item until t…
    { sha = "34653ce134bf8261e13e168699736899c9d34ddf", skip = true }, # open new task as a full-sc…
    { sha = "f6111296ef9d0cb0068fbdfbafffe0ac13ff1181", skip = true }, # open a full task screen wi…
    { sha = "8d3f2ae6c72e7e98a229095365bf6fc208f8bc48", skip = true }, # fetch one task and reopen …
    { sha = "391c75a4a66fa00bfc6db55e9e3a79f4af13145a", skip = true }, # add a views tab that opens…
    { sha = "8ac0de9e1b193b16feabc61a33f518072e801cb6", skip = true }, # fetch any view and the vie…
    { sha = "6ebceaa14a192120dd48a746601918677eb53d4e", skip = true }, # show an icon, title and ad…
    { sha = "84cddc8059fde2ceec3558e1a597b1183c18b512", skip = true }, # refresh views in place and…
    { sha = "68237be8017cca9ef1596cf822ec93d9e9b56e43", skip = true }, # show a sync warning on the…
    { sha = "7b4174aca85f107a07ba78cf0a62e22d2cb31225", skip = true }, # add inbox and today screen…
    { sha = "4da4241d69b912b6b3d8c0ebeab0b2e94d7245ce", skip = true }, # add the phone app project …
    { message = "^feat", group = "added" },
    { message = "^fix", group = "fixed" },
    { message = "^perf", group = "performance" },
    { message = "^(build|chore|ci|docs|refactor|style|test)", skip = true },
    { message = ".*", group = "other" },
]
