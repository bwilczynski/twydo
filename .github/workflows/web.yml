name: Web

on:
  workflow_call:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5
        with:
          install_args: node rust

      - name: Check
        run: mise run web-check

      - name: Build
        run: mise run web-build

      - uses: Swatinem/rust-cache@v2

      - name: Build tdo
        run: cargo build -p tdo

      - name: Install WebKit
        run: cd web && npx playwright install --with-deps webkit

      - name: End-to-end
        run: cd web && npm run e2e

      - name: Upload e2e results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: web-e2e-results
          path: |
            web/test-results
            web/playwright-report
          if-no-files-found: ignore
