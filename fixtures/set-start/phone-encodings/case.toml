claim = "2Do stores a start time as the local wall-clock time written as a UTC epoch in <2Do Meta> StartDate, whatever the due; dropping the time writes UTC midnight, removing the start drops the key, and completing a weekly repeat moves the start by the due's days and keeps its time."
origin = "device"
observed = "Phone-created S1-S3 start 2026-11-25 10:00 (no due, date-only due, timed due) all carry StartDate 1795600800 (2026-11-25T10:00Z) and no other change; S9 start 2027-04-06 10:00 (summer time) carries 2027-04-06T10:00Z. S1 to 14:30 gives 14:30Z, S2 time removed gives 00:00Z, S3 start removed drops StartDate. Weekly S7 (due 18:00) and S8 (date-only due), start 09:00, completed: the live tasks start 2026-11-30T09:00Z, the completed copies keep 2026-11-23T09:00Z. DTSTART mirrors DUE throughout."
tests = ["crates/twydo-core/tests/start_time.rs::reads_phone_start_times"]

