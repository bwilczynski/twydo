claim = "Relocating flat families preserves scheduling and maps parent/child identities coherently."
origin = "device"
observed = "Relocating flat families preserves scheduling and maps parent/child identities coherently."
tests = ["crates/twydo-core/tests/edit_family.rs::completing_checklist_completes_open_item"]
supports = ["delete.family"]

[provenance]
source_revision = "41a5fe9534e1b822538f3ec4fdaf2a8d25c1681a"
source_path = "fixtures/phase0/v1/plan6-list2"

[environment]
iphone_2do = "3.91 build 38246"
ios = "27.0.1"
server = "Synology Calendar (DSM 7.1.1-42962 Update 9)"
server_version = "2.4.8-10948"
vdirsyncer = "0.21.0"

[states."create"]
path = "create"
collections = ["list1"]
members = []
action = "create K+k1-3 checklist, P+p1-3 project, R+r1-3 monthly project, L missed monthly, S start monthly, T timed+start+alert monthly, Y timed+start+alert yearly (L and Y fixed by edit before capture)"
device = "iphone"

[states."edit"]
path = "edit"
collections = ["list1"]
members = []
action = "k1 -> k1b; K date -> 2026-12-11; p1 date -> 2026-12-06; r1 notes -> n"
