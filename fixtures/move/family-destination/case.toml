[states."complete-child"]
path = "complete-child"
collections = ["list1"]
members = []
action = "complete k1b, p1, p3 (repeating child), r1, r3, L (missed), S, T, Y"
device = "iphone"

[states."reopen-child"]
path = "reopen-child"
collections = ["list1"]
members = []
action = "reopen k1b, reopen p1, complete L again"
device = "iphone"

[states."complete-parent"]
path = "complete-parent"
collections = ["list1"]
members = []
action = "complete K (k1b,k2,k3 open), P (p1,p2,p3 open), R (r2 open, r1 r3 done); each asked for confirmation"
device = "iphone"

[states."reopen-parent"]
path = "reopen-parent"
collections = ["list1"]
members = []
action = "reopen K, P, and the completed copy of R; no confirmation; phone shows all items open"
device = "iphone"

