claim = "2Do writes one custom relative alert per task in place of its automatic alert: changing the offset rewrites only TRIGGER, removing it or the due date drops the VALARM, and completion copies it unchanged."
origin = "device"
observed = "Phone-created A1-A4/A8 alerts at 15 min, 4 h, 1 day (timed and date-only) and with a start date; A1 changed to 30 min, A2 alert removed, A3 due removed; monthly A7 completed. Each task carries a single VALARM with a negative relative TRIGGER and no RELATED; X-2DOAPP-ISAUTO:1 stays when the default alert is edited in place; X-2DOAPP-RELDUETIME is 0 when an exact time was picked (A2)."
tests = ["crates/twydo-core/tests/edit_alert.rs::set_alert_matches_phone_bytes_15m_4h_1d"]

