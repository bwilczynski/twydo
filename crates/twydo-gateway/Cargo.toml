[package]
name = "twydo-gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The tdo gateway: a WebSocket bridge to the daemon for paired phones"
publish = false

[dependencies]
twydo-core = { path = "../twydo-core" }
twydo-daemon = { path = "../twydo-daemon" }
base64 = "0.22.1"
chrono = { version = "0.4.45", features = ["serde"] }
getrandom = "0.4.3"
httparse = "1.10.1"
libc = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.10.9"
thiserror = "2.0.21"
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }

[dev-dependencies]
tempfile = "3.27.0"
