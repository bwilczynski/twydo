serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
twydo-core = { path = "../twydo-core" }
twydo-daemon = { path = "../twydo-daemon" }
signal-hook = "0.3"
libc = "0.2"
unicode-width = "0.2.3"
